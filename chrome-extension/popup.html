<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .logo {
      width: 26px; height: 26px; border-radius: 5px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 900; font-size: 12px; flex-shrink: 0;
    }
    .logo-text { font-weight: 800; font-size: 14px; }
    .logo-text span { color: #818cf8; }
    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    label {
      display: block;
      font-size: 10px; color: #64748b; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 5px;
    }
    input {
      width: 100%; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 5px;
      padding: 7px 10px; color: #f8fafc; font-size: 12px;
      outline: none; font-family: inherit;
    }
    input:focus { border-color: rgba(99,102,241,0.5); }
    .hint { font-size: 10px; color: #475569; margin-top: 4px; line-height: 1.4; }
    button {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; color: #fff; border-radius: 6px;
      padding: 8px; font-size: 13px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }
    #status {
      font-size: 11px; text-align: center; padding: 6px 10px;
      border-radius: 5px; display: none;
    }
    .sites {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
    }
    .sites-title { font-size: 10px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .site-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">R</div>
    <div class="logo-text">Recruit<span>AI</span> Sourcer</div>
  </div>

  <div class="body">
    <div>
      <label>App URL</label>
      <input id="apiUrl" type="url" placeholder="https://your-app.vercel.app" />
      <div class="hint">Your RecruitAI deployment URL</div>
    </div>

    <div>
      <label>API Key <span style="color:#475569;font-weight:400;text-transform:none">(optional)</span></label>
      <input id="apiKey" type="password" placeholder="Leave blank if not set" />
      <div class="hint">Set SCRAPE_API_KEY in your Vercel env vars to protect the endpoint</div>
    </div>

    <button id="save">Save Settings</button>
    <div id="status"></div>

    <div class="sites">
      <div class="sites-title">Active on</div>
      <div class="site-row"><div class="dot"></div> linkedin.com/in/*</div>
      <div class="site-row"><div class="dot"></div> cv-library.co.uk/candidates/*</div>
      <div class="site-row"><div class="dot"></div> indeed.com/r/*</div>
      <div class="site-row"><div class="dot"></div> reed.co.uk/candidates/*</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
